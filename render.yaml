services:
  - type: web
    name: agriprice-ng
    runtime: python
    # The active dashboard exposes the normalized WFP and NBS sources only.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: AGRIPRICE_DEPLOY_SCOPE
        value: wfp_nbs
